name: P8.4 dlouhý provoz a paměť

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "tests/soak_p8*.py"
      - "tests/test_p84*.py"
      - "src/skodacad/gui/main_window.py"
      - ".github/workflows/p84-long-run.yml"
  push:
    branches: [main]
    paths:
      - "tests/soak_p8*.py"
      - "tests/test_p84*.py"
      - "src/skodacad/gui/main_window.py"
      - ".github/workflows/p84-long-run.yml"
  workflow_dispatch:

concurrency:
  group: p84-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  long-run:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalace
        run: python -m pip install -e ".[dev,gui]"
      - name: Nativní podpora přístupnosti macOS
        if: runner.os == 'macOS'
        run: python packaging/build_macos_accessibility.py
      - name: Kontroly důkazů, vlastnictví oken a fyzikálních referencí
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_p84_soak.py tests/test_p84_windows.py tests/test_p81_reference.py
      - name: Dva zahřívací a dvacet úplných pracovních cyklů v jednom nativním procesu
        run: python tests/soak_p8.py --output p84-long-run.json --cycles 20 --warmups 2 --timeout 2400
      - name: Průběžné body, výsledky, protokol a skutečná okna
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p84-${{ matrix.os }}
          path: |
            p84-long-run.json
            p84-long-run/events.jsonl
            p84-long-run/footer.json
            p84-long-run/failure.json
            p84-long-run/process.log
            p84-long-run/*-first.png
            p84-long-run/*-last.png
            p84-long-run/current.step
            p84-long-run/saved.json
          retention-days: 30
