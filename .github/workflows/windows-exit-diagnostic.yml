name: Diagnostika ukončování Windows testů

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/diagnose_pytest_exit.py
      - .github/workflows/windows-exit-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    # Záměrně i v draftu: izolované vyšetření, žádné vydání ani náhrada běžné kontroly.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Stejné prostředí jako vydávací kontrola
        run: python -m pip install -e ".[dev,gui,build]" pefile
      - name: Ruff
        run: ruff check src tests tools/diagnose_pytest_exit.py
      - name: Testy s hranicemi ukončování a snímkem vláken
        timeout-minutes: 35
        run: python tools/diagnose_pytest_exit.py --output exit-diagnostic --timeout 2040 --exit-grace 90 -- -q --durations=20 --junitxml=pytest-results.xml
      - name: Evidence a případný nativní dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exit-diagnostic
          path: |
            exit-diagnostic/
            pytest-results.xml
          retention-days: 14
