name: Diagnostika ukončování Windows testů

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/diagnose_pytest_exit.py
      - tests/qt_cleanup.py
      - tests/test_qt_cleanup.py
      - tests/conftest.py
      - .github/workflows/windows-exit-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    # Záměrně i v draftu: izolované vyšetření, žádné vydání ani náhrada běžné kontroly.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Stejné prostředí jako vydávací kontrola
        run: python -m pip install -e ".[dev,gui,build]" pefile
      - name: Ruff
        run: ruff check src tests tools/diagnose_pytest_exit.py
      - name: Cílený životní cyklus Qt s diagnostikou skutečného ukončení
        timeout-minutes: 5
        run: python tools/diagnose_pytest_exit.py --output exit-diagnostic --timeout 240 --exit-grace 30 -- -q tests/test_qt_cleanup.py tests/test_gui.py::test_open_shows_parameters_tree_and_properties tests/test_gui.py::test_parameter_change_rebuilds tests/test_gui.py::test_preview_survives_deferred_deletion_of_previous_form_actions --junitxml=pytest-results.xml
      - name: Evidence a případný nativní dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-exit-diagnostic
          path: |
            exit-diagnostic/
            pytest-results.xml
          retention-days: 14
