name: P3 STEP přenos mezi systémy
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/p35-cross-os.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vytvor-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .
      - run: python tests/p35_cross_os.py create p35-mac
      - run: python tests/benchmark_p35_step.py
      - uses: actions/upload-artifact@v4
        with:
          name: p35-modely-macos
          path: p35-mac/*.json
  vytvor-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .
      - run: python tests/p35_cross_os.py create p35-windows
      - run: python tests/benchmark_p35_step.py
      - uses: actions/upload-artifact@v4
        with:
          name: p35-modely-windows
          path: p35-windows/*.json
  cti-windows:
    needs: vytvor-macos
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: p35-modely-macos
          path: prenesene
      - run: python tests/p35_cross_os.py check prenesene
  cti-macos:
    needs: vytvor-windows
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: p35-modely-windows
          path: prenesene
      - run: python tests/p35_cross_os.py check prenesene
