name: P7.23 Windows GUI shutdown diagnostic
on:
  push:
    branches: [codex/p7-pick-center-shutdown]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalace
        run: python -m pip install -e ".[dev,gui]"
      - name: GUI tests and shutdown trace
        timeout-minutes: 9
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cat > p723_gui_shutdown.py <<'PY'
          import atexit, faulthandler, multiprocessing, sys, threading
          if __name__ == "__main__":
              import pytest
              faulthandler.enable()
              faulthandler.dump_traceback_later(180, repeat=True)
              code = pytest.main(["-q", "tests/test_gui.py", "tests/test_assembly_gui.py", "tests/test_rotation_center_pick.py", "tests/test_rotation_drag.py", "tests/test_selection_drag.py"])
              print("PYTEST_RETURNED", code, flush=True)
              print("THREADS", [(t.name, t.daemon) for t in threading.enumerate()], flush=True)
              print("CHILDREN", [(p.name, p.is_alive()) for p in multiprocessing.active_children()], flush=True)
              atexit.register(lambda: print("ATEXIT_REACHED", flush=True))
              faulthandler.dump_traceback_later(20, repeat=True)
              sys.exit(code)
          PY
          python -u p723_gui_shutdown.py
