# Sestavení ŠkodaCAD pro macOS (Apple Silicon): testy → SkodaCAD.app → kontroly → ke stažení.
# Samostatně vedle „Windows aplikace“ (ten se nemění). Druhá úloha stáhne přesně ten ZIP, který
# dostane uživatel, rozbalí ho a spustí self-test aplikace z něj.
# Z větve main se zveřejní jako předběžné vydání „nejnovejsi-mac“ – odkaz pro Windows
# (releases/latest) zůstává na vydání „nejnovejsi“.
name: macOS aplikace

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sestaveni:
    runs-on: macos-15  # Apple Silicon (arm64) jako MacBook Air M4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Počítač a Python
        run: |
          sw_vers
          uname -m
          python -c "import platform, sys; print(sys.version, platform.machine())"

      - name: Instalace
        run: python -m pip install -e ".[dev,gui,build]"

      - name: Kontrola kódu
        run: ruff check src tests

      - name: Testy
        timeout-minutes: 35  # zaseknutý dialog v testu nesmí blokovat celé sestavení (testy ~12 min)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=20 --junitxml=pytest-results.xml

      - name: Měřicí baseline P0 (bez prahu rychlosti)
        timeout-minutes: 3
        run: python tests/benchmark_p0.py --output p0-baseline.json

      - name: Evidence testů a baseline P0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-checks-macos
          path: |
            pytest-results.xml
            p0-baseline.json
          retention-days: 14

      - name: Zápis sestavení (commit a datum do zprávy auditu)
        shell: bash
        run: |
          printf 'COMMIT = "%s"\nDATE = "%s"\n' "${{ github.sha }}" "$(date -u +%Y-%m-%d)" \
            > src/skodacad/_build.py
          cat src/skodacad/_build.py

      - name: Sestavení SkodaCAD.app
        run: pyinstaller packaging/skodacad.spec --noconfirm --distpath dist --workpath build

      - name: Architektura a podpis
        run: |
          file dist/SkodaCAD.app/Contents/MacOS/SkodaCAD
          codesign --verify --deep --verbose=2 dist/SkodaCAD.app
          du -sh dist/SkodaCAD.app

      # ditto zachová práva a odkazy uvnitř .app (artefakt GitHubu by je ztratil).
      - name: Zabalení do ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/SkodaCAD.app SkodaCAD-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SkodaCAD-macos
          path: SkodaCAD-macos.zip
          retention-days: 7

  kontrola-stazeni:
    needs: sestaveni
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkodaCAD-macos
          path: stazeno

      - name: Rozbalení jako u uživatele
        run: ditto -x -k stazeno/SkodaCAD-macos.zip rozbaleno

      - name: Self-test staženého balíčku
        timeout-minutes: 8
        env:
          SKODACAD_HOME: ${{ runner.temp }}/skodacad-home
        run: |
          set +e
          ./rozbaleno/SkodaCAD.app/Contents/MacOS/SkodaCAD --self-test "$PWD/self-test.txt"
          code=$?
          cat self-test.txt || echo "Zpráva self-testu nevznikla"
          if [ $code -ne 0 ]; then
            echo "--- skodacad.log ---"
            cat "$SKODACAD_HOME/skodacad.log" || echo "Log nevznikl"
          fi
          exit $code

      - name: Zpráva self-testu staženého balíčku
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-self-test-macos
          path: self-test.txt
          retention-days: 14

      # Při pádu (segfault) zapíše macOS hlášení s nativním zásobníkem – vypsat spadlé vlákno.
      - name: Hlášení macOS o pádu (jen při chybě)
        if: failure()
        run: |
          sleep 15
          python3 - <<'EOF'
          import glob, json, os
          folder = os.path.expanduser("~/Library/Logs/DiagnosticReports")
          files = sorted(glob.glob(f"{folder}/SkodaCAD*.ips"), key=os.path.getmtime)
          if not files:
              print("Žádné hlášení o pádu:", os.listdir(folder) if os.path.isdir(folder) else "")
              raise SystemExit
          body = json.loads(open(files[-1], encoding="utf-8").read().split("\n", 1)[1])
          images = body.get("usedImages", [])
          print(files[-1], body.get("exception"), body.get("termination"))
          for thread in body.get("threads", []):
              if thread.get("triggered"):
                  for frame in thread.get("frames", [])[:60]:
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
                      print(f"  {image}: {frame.get('symbol', hex(frame.get('imageOffset', 0)))}")
          EOF

      - name: Zveřejnění ke stažení (jen z main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nejnovejsi-mac --yes --cleanup-tag || true
          gh release create nejnovejsi-mac stazeno/SkodaCAD-macos.zip \
            --target "${{ github.sha }}" \
            --title "ŠkodaCAD – zkušební verze pro macOS (Apple Silicon)" \
            --notes "Sestaveno automaticky z commitu ${{ github.sha }}. Stáhni SkodaCAD-macos.zip, rozbal, přetáhni SkodaCAD do Aplikací a při prvním spuštění povol v Nastavení systému → Soukromí a zabezpečení → Přesto otevřít. Zatím neověřeno na skutečném Macu." \
            --prerelease \
            --latest=false
