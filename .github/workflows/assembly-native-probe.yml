name: Assembly native diagnostic
on:
  push:
    branches: [codex/assembly-native-probe]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[gui,build]"
      - run: pyinstaller packaging/skodacad.spec --noconfirm --distpath dist --workpath build
      - run: python packaging/check_dlls.py dist/SkodaCAD
      - uses: actions/upload-artifact@v4
        with:
          name: native-probe-windows
          path: dist/
          include-hidden-files: true
          retention-days: 1
  native:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-probe-windows
          path: stazeno
      - name: Native self-test
        shell: bash
        env:
          SKODACAD_HOME: ${{ runner.temp }}/skodacad-home
        run: |
          set +e
          ./stazeno/SkodaCAD/SkodaCAD.exe --self-test native-self-test.txt
          code=$?
          cat native-self-test.txt || true
          if [ $code -ne 0 ]; then
            cat "$SKODACAD_HOME/skodacad.log" || true
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-report
          path: native-self-test.txt
          retention-days: 7
