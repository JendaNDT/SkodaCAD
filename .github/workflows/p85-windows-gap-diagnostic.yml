name: P8.5 Windows Qt gap diagnostic (one cycle)

on:
  push:
    branches: [codex/p8-5-response-diagnostic]
    paths:
      - tests/diagnose_p85.py
      - .github/workflows/p85-windows-gap-diagnostic.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked native dependencies
        run: python -m pip install -e ".[dev,gui]"
      - name: One original native cycle, timed Qt dispatch and GUI calls
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tests").resolve()))
          import budget_p8
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("P85_DIAG_ENV " + json.dumps({"commit": commit, "hashes": budget_p8.manifest(),
              "diagnostic_only": True, "budget_acceptance": False}), flush=True)
          subprocess.run([sys.executable, "tests/diagnose_p85.py", "--output",
              "p85-windows-gap-diagnostic"], check=True,
              env={**os.environ, "PYTHONPATH": str(Path("src").resolve())}, timeout=660)
      - name: Preserve complete diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p85-windows-gap-diagnostic
          path: p85-windows-gap-diagnostic/**
          retention-days: 30
