name: P7.22 nativni Windows probe
on:
  push:
    branches: [codex/p7-custom-center-probe]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalace
        run: python -m pip install -e ".[dev,gui]"
      - name: Vlastni stred
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_assembly_batch_rotation.py tests/test_assembly_rotation_center.py tests/test_assembly_gui.py -k "nested_parents_rotate or center or custom_rotation" --junitxml=probe-tests.xml
      - name: Nativni self-test
        timeout-minutes: 6
        env:
          SKODACAD_HOME: ${{ runner.temp }}/p722-probe-home
        run: |
          python -m skodacad.gui.app --self-test probe-native.txt
          cat probe-native.txt
      - name: Protokoly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p722-native-probe-windows
          path: |
            probe-tests.xml
            probe-native.txt
          retention-days: 7
