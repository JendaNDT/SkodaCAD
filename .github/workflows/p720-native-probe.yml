name: P7.20 rychla nativni kontrola Windows
on:
  push:
    branches: [codex/p7-batch-rotation-probe]
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,gui]"
      - name: Regrese otaceni
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_assembly_batch_rotation.py tests/test_assembly_gui.py -k "rotation or gimbal or functions_and_pi"
      - name: Nativni self-test
        env:
          SKODACAD_HOME: out/probe-home
        run: |
          New-Item -ItemType Directory -Force out
          python -m skodacad.gui.app --self-test out/probe.txt
          Get-Content out/probe.txt | Select-Object -Last 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p720-native-windows
          path: |
            out/probe.txt
            out/probe-home/skodacad.log
