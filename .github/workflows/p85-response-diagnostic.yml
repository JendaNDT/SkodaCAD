name: P8.5 jednorázová diagnostika odezvy (není přejímka)
on:
  push:
    branches: [codex/p8-5-response-diagnostic]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalace
        run: python -m pip install -e ".[dev,gui]"
      - name: Nativní podpora přístupnosti
        run: python packaging/build_macos_accessibility.py
      - name: Jeden diagnostický cyklus, žádná přejímka rozpočtů
        run: python tests/diagnose_p85.py --output diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p85-response-diagnostic
          path: diagnostic/**
          retention-days: 30
