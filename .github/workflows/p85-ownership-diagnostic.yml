name: P8.5 cílená diagnostika vlastníků a odezvy (není přejímka)
on:
  push:
    branches: [codex/p8-5-response-diagnostic]
    paths:
      - tests/diagnose_p85_ownership.py
      - .github/workflows/p85-ownership-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalace
        run: python -m pip install -e ".[dev,gui]"
      - name: Nativní podpora přístupnosti
        run: python packaging/build_macos_accessibility.py
      - name: Tři diagnostické cykly, původní fyzika a samostatné stopy VM
        run: python tests/diagnose_p85_ownership.py --output ownership-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p85-ownership-diagnostic
          path: ownership-diagnostic/**
          retention-days: 30
